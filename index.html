<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --amethyst:#A230A4;
  --dark:#290087;
  --periwinkle:#CAC5E5;
  --vanilla:#F2E0A4;
  --honeydew:#F6FFE9;
  --bg:#F8F4FF;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Baloo 2',sans-serif;
  background:linear-gradient(180deg,#F8F4FF 0%,#F3EEFF 55%,#FFFDF8 100%);
  color:var(--dark);
  overflow-x:hidden;
  min-height:100vh;
}

/* Background */

.pattern{
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(var(--periwinkle) 2px, transparent 2px),
    radial-gradient(var(--vanilla) 2px, transparent 2px);
  background-size:56px 56px;
  background-position:0 0,28px 28px;
  opacity:.16;
  pointer-events:none;
  z-index:-2;
}

.container{
  width:min(760px,92%);
  margin:auto;
  padding:28px 0 60px;
  position:relative;
}

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(6px);
  opacity:.7;
  z-index:-1;
}

.b1{
  width:300px;
  height:300px;
  background:#E9C4F3;
  top:-20px;
  left:50%;
  transform:translateX(-50%);
}

.b2{
  width:130px;
  height:130px;
  background:#F9EDBF;
  right:-30px;
  top:180px;
}

.b3{
  width:150px;
  height:150px;
  background:#D7D0F0;
  left:-40px;
  bottom:80px;
}

.star{
  position:absolute;
  color:var(--vanilla);
  text-shadow:2px 2px var(--amethyst);
  font-size:58px;
  z-index:1;
}

.s1{top:5px;left:-5px;}
.s2{top:120px;right:-5px;}
.s3{bottom:145px;left:20px;font-size:34px;}
.s4{bottom:100px;right:80px;font-size:28px;}

/* Header */

.header{
  position:relative;
  text-align:center;
  z-index:2;
}

.ribbon{
  background:linear-gradient(90deg,var(--amethyst),var(--dark));
  color:var(--honeydew);
  padding:18px;
  border-radius:18px;
  transform:rotate(-4deg);
  text-shadow:3px 3px var(--dark);
  box-shadow:8px 8px 0 var(--dark);
  font-size:50px;
  font-weight:800;
  letter-spacing:1px;
}

.sub{
  display:inline-block;
  margin-top:18px;
  background:var(--honeydew);
  border:4px solid var(--dark);
  border-radius:14px;
  padding:8px 24px;
  font-size:24px;
  font-weight:700;
}

.tip{
  margin-top:18px;
  color:#6A4AA2;
  font-size:24px;
  font-weight:800;
}

/* Ticket */

.ticket{
  margin-top:34px;
  border:5px solid var(--dark);
  border-radius:30px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:.25s;
  box-shadow:8px 8px 0 var(--dark);
}

.ticket:hover{
  transform:translateY(-4px);
}

.ticket::before,
.ticket::after{
  content:"";
  position:absolute;
  width:34px;
  height:34px;
  background:#FFF8F4;
  border:5px solid var(--dark);
  border-radius:50%;
  top:50%;
  transform:translateY(-50%);
}

.ticket::before{left:-18px;}
.ticket::after{right:-18px;}

.viet{
  background:linear-gradient(
      135deg,
      var(--periwinkle) 0%,
      #B792FF 45%,
      var(--amethyst) 100%
  );
}

.trang{
  background:linear-gradient(
      135deg,
      var(--periwinkle) 0%,
      #E5D7F8 55%,
      var(--honeydew) 100%
  );
}

.content{
  display:flex;
  align-items:center;
  gap:20px;
  padding:22px;
}

.avatar{
  width:125px;
  height:125px;
  border-radius:24px;
  object-fit:cover;
  border:4px solid white;
  background:#fff;
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.right{
  flex:1;
}

.nameBox{
  background:rgba(246,255,233,.95);
  border:3px solid var(--dark);
  border-radius:14px;
  text-align:center;
  padding:8px;
}

.small{
  font-size:15px;
  font-weight:600;
  color:var(--amethyst);
}

.name{
  font-size:34px;
  font-weight:800;
  color:var(--dark);
  line-height:1.1;
}

.scoreBox{
  margin-top:14px;
  background:rgba(246,255,233,.95);
  border:3px solid var(--dark);
  border-radius:16px;
  padding:10px;
}

.score{
  font-family:monospace;
  font-size:72px;
  font-weight:800;
  text-align:center;
  color:var(--dark);
  letter-spacing:2px;
  transition:.15s;
}

.comment{
  margin-top:12px;
  background:rgba(255,255,255,.75);
  border-radius:14px;
  padding:10px 14px;
  min-height:56px;
  font-size:16px;
  color:#5E4A82;
  line-height:1.35;
}

.badge{
  position:absolute;
  top:14px;
  right:16px;
  background:var(--vanilla);
  color:var(--dark);
  border:3px solid var(--dark);
  border-radius:999px;
  padding:4px 12px;
  font-size:13px;
  font-weight:800;
  transform:rotate(-8deg);
}

/* Football */

.footer{
  display:flex;
  justify-content:flex-end;
  margin-top:34px;
}

.football{
  width:180px;
}

/* Responsive */

@media(max-width:640px){

.ribbon{
  font-size:38px;
}

.tip{
  font-size:19px;
}

.content{
  flex-direction:column;
  text-align:center;
}

.avatar{
  width:145px;
  height:145px;
}

.name{
  font-size:28px;
}

.score{
  font-size:58px;
}

}
</style>
</head>

<body>

<div class="pattern"></div>

<div class="container">

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="star s1">★</div>
<div class="star s2">★</div>
<div class="star s3">★</div>
<div class="star s4">★</div>

<div class="header">

<div class="ribbon">SCORE BOARD</div>

<div class="sub">Bảng Chấm Điểm</div>

<div class="tip">
Bấm vào từng thẻ để random điểm ✨
</div>

</div>

<!-- VIỆT ANH -->

<div class="ticket viet" onclick="rollViet()">

<div class="badge">EMBÉ</div>

<div class="content">

<img src="vietanh.png" class="avatar" alt="Việt Anh">

<div class="right">

<div class="nameBox">
<div class="small">Bạn nhỏ</div>
<div class="name">Việt Anh</div>
</div>

<div class="scoreBox">
<div id="vietScore" class="score">000</div>
</div>

<div id="vietText" class="comment">
Bấm để chấm điểm 💕
</div>

</div>

</div>

</div>

<!-- TRANG -->

<div class="ticket trang" onclick="rollTrang()">

<div class="badge">SIU QUẬY</div>

<div class="content">

<img src="trang.png" class="avatar" alt="Trang">

<div class="right">

<div class="nameBox">
<div class="small">Cô</div>
<div class="name">Trang</div>
</div>

<div class="scoreBox">
<div id="trangScore" class="score">000</div>
</div>

<div id="trangText" class="comment">
Bấm để chấm điểm 🌷
</div>

</div>

</div>

</div>

<!-- FOOTBALL -->

<div class="footer">

<svg class="football" viewBox="0 0 220 140">

<ellipse cx="110" cy="70" rx="88" ry="58"
fill="#FF615E"
transform="rotate(-20 110 70)"/>

<path d="M68 18 Q110 70 152 122"
stroke="#FFF7EC"
stroke-width="12"/>

<path d="M152 18 Q110 70 68 122"
stroke="#FFF7EC"
stroke-width="12"/>

<path d="M40 100 Q110 50 180 40"
stroke="#290087"
stroke-width="3"
fill="none"/>

<g stroke="#290087" stroke-width="3">
<line x1="90" y1="65" x2="130" y2="55"/>
<line x1="98" y1="52" x2="105" y2="68"/>
<line x1="110" y1="48" x2="118" y2="64"/>
<line x1="122" y1="44" x2="130" y2="60"/>
</g>

</svg>

</div>

</div>

<script>

const vietComments=[
"Main character của ngày 💕",
"Xứng đáng nhận một chiếc tem! ✨",
"Hôm nay phong độ quá đỉnh 🌟",
"Ngoan xinh iu thế nhở? 🌷",
"Đúng chuẩn bé cưng xuất sắc 💜"
];

const trangComments=[
"Quá trời quá đất",
"Coi chỉ quậy kìa",
"Trời đất quơi",
"Xỉu up xỉu down với chỉ",
"Chọt cù lét chỉ đi"
];

function animateScore(el,min,max,callback){

let frame=0;

const timer=setInterval(()=>{

const value=Math.floor(Math.random()*(max-min+1))+min;

el.textContent=String(value).padStart(3,"0");

frame++;

if(frame>=24){

clearInterval(timer);

const finalValue=Math.floor(Math.random()*(max-min+1))+min;

el.textContent=String(finalValue).padStart(3,"0");

callback();

}

},40);

}

function randomText(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function rollViet(){

animateScore(
document.getElementById("vietScore"),
90,
120,
()=>{
document.getElementById("vietText").textContent=randomText(vietComments);
}
);

}

function rollTrang(){

animateScore(
document.getElementById("trangScore"),
0,
49,
()=>{
document.getElementById("trangText").textContent=randomText(trangComments);
}
);

}

</script>

</body>
</html>
