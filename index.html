<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Board</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    body{background:#F6F1EA;overflow-x:hidden}
    .container{max-width:720px;margin:auto;padding:28px 18px 40px;position:relative}
    .bg-circle{position:absolute;width:360px;height:360px;background:#E8B5F2;border-radius:50%;top:20px;left:50%;transform:translateX(-50%)}
    .star{position:absolute;font-size:70px;color:#F7A93B}.s1{top:20px;left:10px}.s2{top:120px;right:0}.s3{bottom:80px;left:40px;font-size:55px}.s4{bottom:140px;right:70px;font-size:45px}
    .header{text-align:center;position:relative;margin-top:40px}
    .ribbon{background:linear-gradient(90deg,#8E6CF8,#A678FF);color:#fff;font-size:56px;font-weight:900;padding:18px;border-radius:8px;transform:rotate(-7deg);text-shadow:4px 4px #3B005A;box-shadow:8px 8px #4B006B;letter-spacing:2px}
    .subtitle{display:inline-block;background:#FFF7ED;border:4px solid #43104D;padding:10px 34px;margin-top:-8px;font-size:24px;font-weight:700}
    .tip{margin-top:24px;color:#35104A;letter-spacing:2px;font-size:14px;font-weight:700}
    .ticket{margin-top:30px;border:5px solid #3B005A;border-radius:28px;padding:22px;position:relative;box-shadow:8px 8px #4B006B;cursor:pointer;transition:.2s}.ticket:hover{transform:translateY(-4px)}
    .purple{background:linear-gradient(90deg,#8F6AF6,#A17CFF)}.pink{background:linear-gradient(90deg,#F4B6DA,#F7C7E4)}
    .ticket:before,.ticket:after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:#F6F1EA;border:5px solid #3B005A;top:50%;transform:translateY(-50%)}.ticket:before{left:-22px}.ticket:after{right:-22px}
    .row{display:flex;align-items:center;gap:18px}.avatar{width:120px;height:120px;flex-shrink:0}.info{flex:1}
    .namebox{background:#FFF7ED;border:4px solid #3B005A;border-radius:8px;text-align:center;padding:8px}.small{font-size:18px;font-weight:700;color:#35104A}.name{font-size:40px;font-weight:900;color:#35104A}
    .scorewrap{margin-top:14px;background:#FFF7ED;border:4px solid #3B005A;padding:12px;display:flex;justify-content:center}.score{font-family:monospace;font-size:78px;font-weight:900;color:#3B005A;letter-spacing:3px;transition:.15s}
    .doodle{position:absolute;top:20px;right:22px;color:#3B005A;font-size:24px;font-weight:900;transform:rotate(-12deg)}.hearts{font-size:30px}.footer{margin-top:34px;display:flex;justify-content:flex-end}.football{width:180px;height:120px}
    @media(max-width:600px){.ribbon{font-size:42px}.name{font-size:32px}.score{font-size:58px}.avatar{width:92px;height:92px}}
  </style>
</head>
<body>
<div class="container">
<div class="bg-circle"></div><div class="star s1">★</div><div class="star s2">★</div><div class="star s3">★</div><div class="star s4">★</div>
<div class="header"><div class="ribbon">SCORE BOARD</div><div class="subtitle">Bảng Chấm Điểm</div><div class="tip">BẤM VÀO TỪNG THẺ ĐỂ RANDOM ĐIỂM</div></div>
<div class="ticket purple" onclick="roll('viet',90,120)"><div class="doodle">♕ MVP!</div><div class="row"><svg class="avatar" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#FFF7ED" stroke="#3B005A" stroke-width="4"/><ellipse cx="60" cy="68" rx="36" ry="30" fill="#FFE8D6"/><path d="M20 42 Q60 8 100 40 L96 54 Q60 26 24 52 Z" fill="#2E124A"/><path d="M18 34 L62 18 L102 38 L92 48 L28 46 Z" fill="#8F6AF6" stroke="#3B005A" stroke-width="3"/><circle cx="48" cy="66" r="3" fill="#2E124A"/><circle cx="72" cy="66" r="3" fill="#2E124A"/><path d="M50 80 Q60 86 70 80" stroke="#C46B8A" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="40" cy="74" r="4" fill="#F6B3C7"/><circle cx="80" cy="74" r="4" fill="#F6B3C7"/></svg><div class="info"><div class="namebox"><div class="small">Bạn nhỏ</div><div class="name">Việt Anh</div></div><div class="scorewrap"><div id="viet" class="score">100</div></div></div></div></div>
<div class="ticket pink" onclick="roll('trang',0,49)"><div class="doodle hearts">♡ ♡</div><div class="row"><svg class="avatar" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#FFF7ED" stroke="#3B005A" stroke-width="4"/><circle cx="60" cy="24" r="16" fill="#2E124A"/><path d="M30 36 Q60 8 90 36 L96 60 Q60 20 24 58 Z" fill="#3A1A55"/><ellipse cx="60" cy="68" rx="36" ry="30" fill="#FFE8D6"/><path d="M32 48 Q24 62 30 82" stroke="#3A1A55" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="48" cy="66" r="3" fill="#2E124A"/><circle cx="72" cy="66" r="3" fill="#2E124A"/><path d="M50 80 Q60 86 70 80" stroke="#C46B8A" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="40" cy="74" r="4" fill="#F6B3C7"/><circle cx="80" cy="74" r="4" fill="#F6B3C7"/><rect x="30" y="52" width="12" height="5" rx="2" fill="#A678FF"/></svg><div class="info"><div class="namebox"><div class="small">Cô</div><div class="name">Trang</div></div><div class="scorewrap"><div id="trang" class="score">17</div></div></div></div></div>
<div class="footer"><svg class="football" viewBox="0 0 220 140"><ellipse cx="110" cy="70" rx="88" ry="58" fill="#FF5B58" transform="rotate(-20 110 70)"/><path d="M68 18 Q110 70 152 122" stroke="#FFF4E8" stroke-width="12"/><path d="M152 18 Q110 70 68 122" stroke="#FFF4E8" stroke-width="12"/><path d="M40 100 Q110 50 180 40" stroke="#3B005A" stroke-width="3" fill="none"/><g stroke="#3B005A" stroke-width="3"><line x1="90" y1="65" x2="130" y2="55"/><line x1="98" y1="52" x2="105" y2="68"/><line x1="110" y1="48" x2="118" y2="64"/><line x1="122" y1="44" x2="130" y2="60"/></g></svg></div>
</div>
<script>
function roll(id,min,max){const el=document.getElementById(id);let i=0;const timer=setInterval(()=>{el.textContent=Math.floor(Math.random()*(max-min+1))+min;el.style.transform='scale(1.08)';if(++i>=22){clearInterval(timer);el.textContent=Math.floor(Math.random()*(max-min+1))+min;el.style.transform='scale(1)';}},40);}
</script>
</body>
</html>
