
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Board</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Fredoka',sans-serif;
    background:#FFF8F3;
    overflow-x:hidden;
}

/* ---------- Background ---------- */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 15% 15%, #FFD7E8 0 90px, transparent 91px),
    radial-gradient(circle at 85% 20%, #DCC9FF 0 120px, transparent 121px),
    radial-gradient(circle at 20% 80%, #FFE9BF 0 80px, transparent 81px),
    radial-gradient(circle at 80% 85%, #F6D2E6 0 100px, transparent 101px);
    opacity:.7;
    z-index:-2;
}

.pattern{
    position:fixed;
    inset:0;
    background-image:
    radial-gradient(#F6B4CF 2px, transparent 2px),
    radial-gradient(#C8A8FF 2px, transparent 2px);
    background-size:60px 60px;
    background-position:0 0,30px 30px;
    opacity:.15;
    z-index:-1;
}

.container{
    width:min(720px,92%);
    margin:auto;
    padding:30px 0 60px;
}

/* ---------- Header ---------- */

.ribbon{
    background:linear-gradient(90deg,#8E6CF8,#B48DFF);
    color:#fff;
    text-align:center;
    padding:18px;
    font-family:'Baloo 2';
    font-size:52px;
    font-weight:800;
    border-radius:14px;
    transform:rotate(-4deg);
    text-shadow:3px 3px #5A33B5;
    box-shadow:8px 8px 0 #5A33B5;
}

.sub{
    width:max-content;
    margin:18px auto 0;
    background:#FFFDF8;
    border:4px solid #4A2C74;
    border-radius:14px;
    padding:8px 24px;
    font-family:'Baloo 2';
    font-size:24px;
    color:#4A2C74;
}

.tip{
    text-align:center;
    margin-top:16px;
    color:#6C4A93;
    font-weight:600;
    letter-spacing:1px;
}

/* ---------- Ticket ---------- */

.ticket{
    margin-top:28px;
    position:relative;
    border-radius:28px;
    border:5px solid #4A2C74;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    box-shadow:8px 8px 0 #4A2C74;
}

.ticket:hover{
    transform:translateY(-4px);
}

.ticket::before,
.ticket::after{
    content:"";
    position:absolute;
    top:50%;
    width:34px;
    height:34px;
    background:#FFF8F3;
    border:5px solid #4A2C74;
    border-radius:50%;
    transform:translateY(-50%);
    z-index:5;
}

.ticket::before{left:-18px;}
.ticket::after{right:-18px;}

.purple{
    background:linear-gradient(135deg,#8F6AF6,#B595FF);
}

.pink{
    background:linear-gradient(135deg,#F6B8D7,#FFD4E5);
}

.content{
    padding:20px;
    display:flex;
    gap:18px;
    align-items:center;
}

/* ---------- Avatar ---------- */

.avatar{
    width:120px;
    height:120px;
    border-radius:22px;
    border:4px solid #FFF8F3;
    object-fit:cover;
    background:#ffffff55;
    box-shadow:0 6px 16px rgba(0,0,0,.15);
}

/* ---------- Right ---------- */

.right{
    flex:1;
}

.nameBox{
    background:#FFFDF8;
    border:3px solid #4A2C74;
    border-radius:14px;
    text-align:center;
    padding:8px;
}

.small{
    color:#8B69C8;
    font-size:15px;
    font-weight:600;
}

.name{
    font-family:'Baloo 2';
    font-size:34px;
    color:#4A2C74;
    font-weight:800;
    line-height:1.1;
}

.scoreBox{
    margin-top:14px;
    background:#FFFDF8;
    border:3px solid #4A2C74;
    border-radius:16px;
    padding:12px;
}

.score{
    font-family:'Baloo 2';
    text-align:center;
    font-size:68px;
    color:#4A2C74;
    font-weight:800;
}

.comment{
    margin-top:12px;
    background:#FFFDF8CC;
    border-radius:12px;
    padding:10px 12px;
    min-height:50px;
    color:#5B4678;
    font-size:15px;
    font-weight:500;
    transition:.25s;
}

/* ---------- Decorations ---------- */

.sticker{
    position:absolute;
    top:14px;
    right:18px;
    background:#FFF8F3;
    color:#7A52C8;
    border:3px solid #4A2C74;
    border-radius:999px;
    padding:4px 10px;
    font-size:13px;
    font-weight:700;
    transform:rotate(-10deg);
}

.footer{
    margin-top:34px;
    text-align:center;
    color:#8B69C8;
    font-size:14px;
}

@media(max-width:640px){

.content{
    flex-direction:column;
    text-align:center;
}

.avatar{
    width:140px;
    height:140px;
}

.ribbon{
    font-size:40px;
}

.name{
    font-size:28px;
}

.score{
    font-size:56px;
}

}
</style>
</head>

<body>

<div class="pattern"></div>

<div class="container">

<div class="ribbon">SCORE BOARD</div>

<div class="sub">Bảng Chấm Điểm</div>

<div class="tip">Bấm vào từng thẻ để random điểm ✨</div>

<!-- Việt Anh -->

<div class="ticket purple" onclick="rollViet()">

<div class="sticker">⭐</div>

<div class="content">

<img src="vietanh.png" class="avatar" alt="Việt Anh">

<div class="right">

<div class="nameBox">
<div class="small">Bạn nhỏ</div>
<div class="name">Việt Anh</div>
</div>

<div class="scoreBox">
<div class="score" id="vietScore">000</div>
</div>

<div class="comment" id="vietText">
Bấm để chấm điểm 🎀
</div>

</div>
</div>
</div>

<!-- Trang -->

<div class="ticket pink" onclick="rollTrang()">

<div class="sticker">💗</div>

<div class="content">

<img src="trang.png" class="avatar" alt="Trang">

<div class="right">

<div class="nameBox">
<div class="small">Cô</div>
<div class="name">Trang</div>
</div>

<div class="scoreBox">
<div class="score" id="trangScore">000</div>
</div>

<div class="comment" id="trangText">
Bấm để chấm điểm 🌷
</div>

</div>
</div>
</div>

<div class="footer">
Pastel • Random Score • Made with ♡
</div>

</div>

<script>

const vietComments=[
"Main character của ngày 💕",
"Xứng đáng nhận một chiếc tem! ✨",
"Hôm nay phong độ quá đỉnh 🌟",
"Ngoan xinh iu thế nhở? 🌷",
"Đúng chuẩn bé cưng xuất sắc 💜"
];

const trangComments=[
"Quá trời quá đất",
"Coi chỉ quậy kìa",
"Trời đất quơi",
"Xỉu up xỉu down với chỉ",
"Chọt cù lét chỉ đi"
];

function animateScore(el,min,max,callback){

let frame=0;

const timer=setInterval(()=>{

const value=Math.floor(Math.random()*(max-min+1))+min;

el.textContent=String(value).padStart(3,'0');

frame++;

if(frame>22){

clearInterval(timer);

const final=Math.floor(Math.random()*(max-min+1))+min;

el.textContent=String(final).padStart(3,'0');

callback();

}

},40);

}

function randomText(arr){
return arr[Math.floor(Math.random()*arr.length)];
}

function rollViet(){

animateScore(
document.getElementById("vietScore"),
90,
120,
()=>{
document.getElementById("vietText").textContent=randomText(vietComments);
}
);

}

function rollTrang(){

animateScore(
document.getElementById("trangScore"),
0,
49,
()=>{
document.getElementById("trangText").textContent=randomText(trangComments);
}
);

}

</script>

</body>
</html>
