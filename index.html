
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Baloo 2',sans-serif;
    background:#FFF8F4;
    overflow-x:hidden;
    color:#4B2D73;
}

/* ---------- BACKGROUND ---------- */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 10% 15%, #FFD8E8 0 110px, transparent 111px),
    radial-gradient(circle at 88% 18%, #DCC7FF 0 120px, transparent 121px),
    radial-gradient(circle at 15% 82%, #FFEAB9 0 90px, transparent 91px),
    radial-gradient(circle at 82% 88%, #F6D4E6 0 100px, transparent 101px);
    opacity:.8;
    z-index:-2;
}

.pattern{
    position:fixed;
    inset:0;
    background-image:
    radial-gradient(#F5BCD3 2px, transparent 2px),
    radial-gradient(#D3B6FF 2px, transparent 2px);
    background-size:56px 56px;
    background-position:0 0,28px 28px;
    opacity:.18;
    z-index:-1;
}

.container{
    width:min(720px,92%);
    margin:auto;
    padding:30px 0 60px;
    position:relative;
}

/* ---------- HEADER ---------- */

.circle{
    position:absolute;
    width:360px;
    height:360px;
    background:#EAB7F4;
    border-radius:50%;
    left:50%;
    top:0;
    transform:translateX(-50%);
    z-index:0;
}

.star{
    position:absolute;
    color:#F8A63A;
    font-size:70px;
    z-index:0;
}

.s1{top:10px;left:-10px;}
.s2{top:80px;right:-10px;}

.header{
    position:relative;
    z-index:2;
    text-align:center;
    margin-top:25px;
}

.ribbon{
    background:linear-gradient(90deg,#8D69F8,#B48FFF);
    color:#fff;
    border-radius:14px;
    padding:16px;
    transform:rotate(-4deg);
    box-shadow:8px 8px 0 #5A33B5;
    text-shadow:3px 3px #5A33B5;
    font-size:48px;
    font-weight:800;
    letter-spacing:1px;
}

.sub{
    display:inline-block;
    margin-top:18px;
    background:#FFFDF8;
    border:4px solid #4B2D73;
    border-radius:14px;
    padding:8px 24px;
    font-size:24px;
    font-weight:700;
}

.tip{
    margin-top:18px;
    font-size:26px;
    font-weight:800;
    color:#6C49A2;
    line-height:1.2;
}

/* ---------- TICKET ---------- */

.ticket{
    margin-top:34px;
    position:relative;
    border-radius:28px;
    border:5px solid #4B2D73;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    box-shadow:8px 8px 0 #4B2D73;
}

.ticket:hover{
    transform:translateY(-4px);
}

.ticket::before,
.ticket::after{
    content:"";
    position:absolute;
    top:50%;
    width:34px;
    height:34px;
    border-radius:50%;
    background:#FFF8F4;
    border:5px solid #4B2D73;
    transform:translateY(-50%);
    z-index:5;
}

.ticket::before{left:-18px;}
.ticket::after{right:-18px;}

.purple{
    background:linear-gradient(135deg,#8F6AF6,#B597FF);
}

.pink{
    background:linear-gradient(135deg,#F5B8D8,#FFD5E6);
}

.content{
    display:flex;
    gap:18px;
    align-items:center;
    padding:22px;
}

/* ---------- AVATAR ---------- */

.avatar{
    width:125px;
    height:125px;
    border-radius:24px;
    object-fit:cover;
    background:#fff;
    border:4px solid #FFF8F4;
    box-shadow:0 8px 18px rgba(0,0,0,.15);
}

/* ---------- INFO ---------- */

.info{
    flex:1;
}

.nameBox{
    background:#FFFDF8;
    border:3px solid #4B2D73;
    border-radius:14px;
    text-align:center;
    padding:8px;
}

.small{
    color:#8C69C8;
    font-size:16px;
    font-weight:600;
}

.name{
    font-size:34px;
    font-weight:800;
    color:#4B2D73;
    line-height:1.1;
}

.scoreBox{
    margin-top:14px;
    background:#FFFDF8;
    border:3px solid #4B2D73;
    border-radius:16px;
    padding:10px;
}

.score{
    font-family:monospace;
    font-size:72px;
    font-weight:800;
    color:#3E245F;
    text-align:center;
    letter-spacing:2px;
    transition:.15s;
}

.comment{
    margin-top:12px;
    background:#FFFDF8CC;
    border-radius:12px;
    padding:10px 12px;
    min-height:54px;
    color:#5B4678;
    font-size:16px;
    line-height:1.3;
}

.badge{
    position:absolute;
    top:14px;
    right:18px;
    background:#FFFDF8;
    border:3px solid #4B2D73;
    border-radius:999px;
    padding:4px 12px;
    color:#7A53C8;
    font-size:13px;
    font-weight:700;
    transform:rotate(-10deg);
}

/* ---------- FOOTER ---------- */

.footer{
    margin-top:34px;
    display:flex;
    justify-content:flex-end;
}

.football{
    width:180px;
    height:auto;
}

@media(max-width:640px){

.ribbon{
    font-size:38px;
}

.tip{
    font-size:20px;
}

.content{
    flex-direction:column;
    text-align:center;
}

.avatar{
    width:140px;
    height:140px;
}

.name{
    font-size:28px;
}

.score{
    font-size:58px;
}

}
</style>

</head>
<body>

<div class="pattern"></div>

<div class="container">

<div class="circle"></div>
<div class="star s1">★</div>
<div class="star s2">★</div>

<div class="header">

<div class="ribbon">SCORE BOARD</div>

<div class="sub">Bảng Chấm Điểm</div>

<div class="tip">
Bấm vào từng thẻ để random điểm ✨
</div>

</div>

<!-- ==================== VIỆT ANH ==================== -->

<div class="ticket purple" onclick="rollViet()">

<div class="badge">⭐</div>

<div class="content">

<img src="vietanh.png" class="avatar" alt="Việt Anh">

<div class="info">

<div class="nameBox">
<div class="small">Bạn nhỏ</div>
<div class="name">Việt Anh</div>
</div>

<div class="scoreBox">
<div class="score" id="vietScore">000</div>
</div>

<div class="comment" id="vietText">
Bấm để chấm điểm 🎀
</div>

</div>

</div>

</div>

<!-- ==================== TRANG ==================== -->

<div class="ticket pink" onclick="rollTrang()">

<div class="badge">😌</div>

<div class="content">

<img src="trang.png" class="avatar" alt="Trang">

<div class="info">

<div class="nameBox">
<div class="small">Cô</div>
<div class="name">Trang</div>
</div>

<div class="scoreBox">
<div class="score" id="trangScore">000</div>
</div>

<div class="comment" id="trangText">
Bấm để chấm điểm 🌷
</div>

</div>

</div>

</div>

<!-- FOOTBALL -->

<div class="footer">

<svg class="football" viewBox="0 0 220 140">
<ellipse cx="110" cy="70" rx="88" ry="58" fill="#FF5B58" transform="rotate(-20 110 70)"/>
<path d="M68 18 Q110 70 152 122" stroke="#FFF4E8" stroke-width="12"/>
<path d="M152 18 Q110 70 68 122" stroke="#FFF4E8" stroke-width="12"/>
<path d="M40 100 Q110 50 180 40" stroke="#3B2D73" stroke-width="3" fill="none"/>
<g stroke="#3B2D73" stroke-width="3">
<line x1="90" y1="65" x2="130" y2="55"/>
<line x1="98" y1="52" x2="105" y2="68"/>
<line x1="110" y1="48" x2="118" y2="64"/>
<line x1="122" y1="44" x2="130" y2="60"/>
</g>
</svg>

</div>

</div>

<script>

// ======= NHẬN XÉT CỦA VIỆT ANH =======

const vietComments=[
"Main character của ngày 💕",
"Ngoan xinh iu thế nhở? 🌷",
"Xứng đáng nhận một chiếc tem ⭐",
"Hôm nay phong độ quá đỉnh 🌟",
"Điểm cao không phải ngẫu nhiên "
];

// ======= NHẬN XÉT CỦA TRANG =======

const trangComments=[
"Quá trời quá đất",
"Coi chỉ quậy kìa",
"Trời đất quơi",
"Xỉu up xỉu down với chỉ",
"Chọt cù lét chỉ đi"
];

// ======= RANDOM SCORE =======

function animateScore(element,min,max,callback){

let frame=0;

const timer=setInterval(()=>{

const value=Math.floor(Math.random()*(max-min+1))+min;

element.textContent=String(value).padStart(3,"0");

frame++;

if(frame>=24){

clearInterval(timer);

const finalValue=Math.floor(Math.random()*(max-min+1))+min;

element.textContent=String(finalValue).padStart(3,"0");

callback();

}

},40);

}

function randomText(array){
return array[Math.floor(Math.random()*array.length)];
}

function rollViet(){

animateScore(
document.getElementById("vietScore"),
90,
120,
()=>{
document.getElementById("vietText").textContent=randomText(vietComments);
}
);

}

function rollTrang(){

animateScore(
document.getElementById("trangScore"),
0,
49,
()=>{
document.getElementById("trangText").textContent=randomText(trangComments);
}
);

}

</script>

</body>
</html>
