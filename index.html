
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Score Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --honeydew:#F6FFE9;
  --vanilla:#F2E0A4;
  --periwinkle:#CAC5E5;
  --amethyst:#A230A4;
  --ultramarine:#290087;
  --cream:#FFFDF7;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Baloo 2',sans-serif;
  background:linear-gradient(
      180deg,
      #F6FFE9 0%,
      #FFF9EF 45%,
      #F6F0FF 100%
  );
  min-height:100vh;
  color:var(--ultramarine);
  overflow-x:hidden;
}

.pattern{
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(var(--periwinkle) 2px, transparent 2px),
    radial-gradient(var(--vanilla) 2px, transparent 2px);
  background-size:58px 58px;
  background-position:0 0,29px 29px;
  opacity:.18;
  pointer-events:none;
  z-index:-1;
}

.container{
  width:min(760px,92%);
  margin:auto;
  padding:30px 0 60px;
  position:relative;
}

/* background decoration */

.circle{
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  background:#E6C3F2;
  left:50%;
  top:0;
  transform:translateX(-50%);
  z-index:0;
}

.star{
  position:absolute;
  font-size:70px;
  color:var(--vanilla);
  text-shadow:2px 2px var(--amethyst);
  z-index:0;
}

.s1{top:0;left:-8px;}
.s2{top:90px;right:-8px;}
.s3{bottom:140px;left:10px;font-size:42px;}
.s4{bottom:110px;right:80px;font-size:36px;}

/* Header */

.header{
  position:relative;
  z-index:2;
  text-align:center;
  margin-top:20px;
}

.ribbon{
  background:linear-gradient(90deg,var(--amethyst),var(--ultramarine));
  color:var(--honeydew);
  font-size:52px;
  font-weight:800;
  padding:16px;
  border-radius:16px;
  transform:rotate(-4deg);
  text-shadow:3px 3px #4B0070;
  box-shadow:8px 8px 0 var(--ultramarine);
}

.sub{
  display:inline-block;
  margin-top:20px;
  background:var(--honeydew);
  border:4px solid var(--ultramarine);
  border-radius:14px;
  padding:8px 26px;
  font-size:24px;
  font-weight:700;
}

.tip{
  margin-top:18px;
  font-size:24px;
  font-weight:800;
  color:#6A4AA1;
}

/* Ticket */

.ticket{
  margin-top:34px;
  position:relative;
  border:5px solid var(--ultramarine);
  border-radius:30px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
  box-shadow:8px 8px 0 var(--ultramarine);
}

.ticket:hover{
  transform:translateY(-4px);
}

.ticket::before,
.ticket::after{
  content:"";
  position:absolute;
  top:50%;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#FFF8F4;
  border:5px solid var(--ultramarine);
  transform:translateY(-50%);
}

.ticket::before{left:-18px;}
.ticket::after{right:-18px;}

.purple{
  background:linear-gradient(
      135deg,
      var(--periwinkle) 0%,
      #B18EFF 45%,
      var(--amethyst) 100%
  );
}

.pink{
  background:linear-gradient(
      135deg,
      var(--vanilla) 0%,
      #F7E8BF 35%,
      var(--honeydew) 100%
  );
}

.content{
  display:flex;
  align-items:center;
  gap:20px;
  padding:22px;
}

.avatar{
  width:125px;
  height:125px;
  border-radius:24px;
  object-fit:cover;
  border:4px solid var(--cream);
  background:#fff;
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.right{
  flex:1;
}

.nameBox{
  background:var(--cream);
  border:3px solid var(--ultramarine);
  border-radius:16px;
  text-align:center;
  padding:8px;
}

.small{
  font-size:15px;
  font-weight:600;
  color:var(--amethyst);
}

.name{
  font-size:34px;
  font-weight:800;
  color:var(--ultramarine);
  line-height:1.1;
}

.scoreBox{
  margin-top:14px;
  background:var(--cream);
  border:3px solid var(--ultramarine);
  border-radius:16px;
  padding:10px;
}

.score{
  font-family:monospace;
  font-size:72px;
  font-weight:800;
  color:var(--ultramarine);
  text-align:center;
  letter-spacing:2px;
}

.comment{
  margin-top:12px;
  background:#FFFFFFCC;
  border-radius:14px;
  padding:10px 14px;
  min-height:54px;
  color:#5E4A82;
  font-size:16px;
  line-height:1.3;
}

.badge{
  position:absolute;
  top:14px;
  right:16px;
  background:var(--vanilla);
  color:var(--ultramarine);
  border:3px solid var(--ultramarine);
  border-radius:999px;
  padding:4px 12px;
  font-size:13px;
  font-weight:800;
  transform:rotate(-8deg);
}

.footer{
  margin-top:34px;
  display:flex;
  justify-content:flex-end;
}

.football{
  width:180px;
}

@media(max-width:640px){

.ribbon{
  font-size:38px;
}

.tip{
  font-size:20px;
}

.content{
  flex-direction:column;
  text-align:center;
}

.avatar{
  width:140px;
  height:140px;
}

.name{
  font-size:28px;
}

.score{
  font-size:58px;
}

}

</style>

</head>

<body>

<div class="pattern"></div>

<div class="container">

<div class="circle"></div>

<div class="star s1">★</div>
<div class="star s2">★</div>
<div class="star s3">★</div>
<div class="star s4">★</div>

<div class="header">

<div class="ribbon">SCORE BOARD</div>

<div class="sub">Bảng Chấm Điểm</div>

<div class="tip">
Bấm vào từng thẻ để random điểm ✨
</div>

</div>

<!-- VIỆT ANH -->

<div class="ticket purple" onclick="rollViet()">

<div class="badge">HONEY</div>

<div class="content">

<img src="vietanh.png" class="avatar" alt="Việt Anh">

<div class="right">

<div class="nameBox">
<div class="small">Bạn nhỏ</div>
<div class="name">Việt Anh</div>
</div>

<div class="scoreBox">
<div class="score" id="vietScore">000</div>
</div>

<div class="comment" id="vietText">
Bấm để chấm điểm 💕
</div>

</div>

</div>

</div>

<!-- TRANG -->

<div class="ticket pink" onclick="rollTrang()">

<div class="badge">VANILLA</div>

<div class="content">

<img src="trang.png" class="avatar" alt="Trang">

<div class="right">

<div class="nameBox">
<div class="small">Cô</div>
<div class="name">Trang</div>
</div>

<div class="scoreBox">
<div class="score" id="trangScore">000</div>
</div>

<div class="comment" id="trangText">
Bấm để chấm điểm 🌷
</div>

</div>

</div>

</div>

<!-- FOOTBALL -->

<div class="footer">

<svg class="football" viewBox="0 0 220 140">

<ellipse cx="110" cy="70" rx="88" ry="58"
fill="#FF625D"
transform="rotate(-20 110 70)"/>

<path d="M68 18 Q110 70 152 122"
stroke="#FFF5E8"
stroke-width="12"/>

<path d="M152 18 Q110 70 68 122"
stroke="#FFF5E8"
stroke-width="12"/>

<path d="M40 100 Q110 50 180 40"
stroke="#290087"
stroke-width="3"
fill="none"/>

<g stroke="#290087" stroke-width="3">

<line x1="90" y1="65" x2="130" y2="55"/>

<line x1="98" y1="52" x2="105" y2="68"/>

<line x1="110" y1="48" x2="118" y2="64"/>

<line x1="122" y1="44" x2="130" y2="60"/>

</g>

</svg>

</div>

</div>

<script>

/* ===========================
   LỜI NHẬN XÉT
=========================== */

const vietComments = [

"Main character của ngày 💕",

"Xứng đáng nhận một chiếc tem! ✨",

"Hôm nay phong độ quá đỉnh 🌟",

"Ngoan xinh iu thế nhở? 🌷",

"Đúng chuẩn bé cưng xuất sắc 💜"

];

const trangComments = [

"Quá trời quá đất",

"Coi chỉ quậy kìa",

"Trời đất quơi",

"Xỉu up xỉu down với chỉ",

"Chọt cù lét chỉ đi"

];

/* ===========================
   RANDOM ĐIỂM
=========================== */

function animateScore(el,min,max,callback){

let frame=0;

const timer=setInterval(()=>{

const value=Math.floor(Math.random()*(max-min+1))+min;

el.textContent=String(value).padStart(3,"0");

frame++;

if(frame>=24){

clearInterval(timer);

const finalValue=Math.floor(Math.random()*(max-min+1))+min;

el.textContent=String(finalValue).padStart(3,"0");

callback();

}

},40);

}

function randomText(arr){

return arr[Math.floor(Math.random()*arr.length)];

}

function rollViet(){

animateScore(

document.getElementById("vietScore"),

90,

120,

()=>{

document.getElementById("vietText").textContent=randomText(vietComments);

}

);

}

function rollTrang(){

animateScore(

document.getElementById("trangScore"),

0,

49,

()=>{

document.getElementById("trangText").textContent=randomText(trangComments);

}

);

}

</script>

</body>
</html>
